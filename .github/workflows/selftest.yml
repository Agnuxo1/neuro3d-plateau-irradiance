name: analytic self-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the minimum needed by the self-tests
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Shadow-map self-tests against analytic cases
        run: python code/selftest_shadow.py
